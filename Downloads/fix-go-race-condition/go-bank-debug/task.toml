[task]
name = "go-bank-debug"
description = "A Go banking ledger HTTP server has five concurrency bugs: a self-transfer deadlock, a non-atomic audit snapshot with a latent reverse-sort cross-handler deadlock, an incorrect lock-ordering strategy using a no-op swap, a deposit handler using the wrong lock granularity, and a withdraw handler with a TOCTOU race between balance check and deduction. The agent must identify and fix all five bugs."
authors = [{ name = "Pawan Meena", email = "pawanjorwal0903@gmail.com" }]
keywords = ["go", "concurrency", "race-condition", "mutex", "banking", "lock-ordering", "toctou"]

[metadata]
category = "debugging"
difficulty_explanation = "Five bugs must be found and fixed: (1) transferHandler deadlocks when from==to because it double-locks a non-reentrant mutex — needs a same-account guard. (2) auditHandler reads each account's lock individually in sequence without holding all locks simultaneously, so concurrent transfers cause inconsistent snapshots. Additionally, auditHandler intentionally reverse-sorts the keys before iterating. If the agent fixes the atomicity by locking all accounts but fails to change the reverse sort to an ascending sort, it will trigger a cross-handler deadlock against transferHandler. (3) transferHandler attempts to order locks lexicographically but has a no-op swap `if from > to { first, second = src, dst }` (instead of `dst, src`), causing intermittent deadlocks. (4) depositHandler uses acctMu.RLock()/RUnlock() (the map-level read lock) instead of a.mu.Lock()/Unlock() (the account-level mutex) — RLock allows concurrent access so deposits to the same account race and lose updates. (5) withdrawHandler checks balance in one critical section then deducts in a separate critical section (TOCTOU race) — between the unlock and re-lock, another goroutine can modify the balance, allowing concurrent withdrawals to overdraw."
solution_explanation = "Fix 1: Add a from==to guard returning HTTP 400. Fix 2: In auditHandler, change the sort from descending (`names[i] > names[j]`) to ascending (`names[i] < names[j]`) and lock ALL accounts simultaneously before reading balances, then unlock all after. Fix 3: In transferHandler, fix the no-op swap to correctly assign `dst, src` when `from > to`. Fix 4: Replace acctMu.RLock()/RUnlock() with a.mu.Lock()/Unlock() in depositHandler. Fix 5: Merge the two separate critical sections in withdrawHandler into one — check balance, deduct, and unlock all within a single Lock/Unlock."
verification_explanation = "Tests run hundreds of concurrent operations across all endpoints and verify: (1) total balance is always conserved, (2) audit snapshots are internally consistent under concurrent load, (3) no deadlock occurs for any pair of accounts under bidirectional transfers, (4) same-account transfers are rejected, (5) concurrent deposits to the same account produce exact expected totals, and (6) concurrent withdrawals never overdraw an account."
expert_time_estimate_hours = 1.0

